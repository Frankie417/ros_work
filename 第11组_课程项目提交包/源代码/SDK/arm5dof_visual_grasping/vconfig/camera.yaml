#############################
## 相机的默认参数
############################# 
# 摄像头的设备号
# 默认为 0:  /dev/video0
device: 0
# 画面宽度
img_width: 640
# 画面高度 
img_height: 480
# 相机帧率
fps: 30
# 图像缓冲区的尺寸
buffer_size: 2
# 图像水平镜像
hflip: False
# 图像垂直镜像
vflip: False

# UVC参数配置
uvc:
  # 亮度
  brightness: 53
  # 对比度
  contrast: 64
  # 色调
  hue: 26
  # 饱和度
  saturation: 102
  # 清晰度(锐度)
  sharpness: 0
  # GAMMA值
  gamma: 91
  # 增益值
  gain: 31
  # 自动白平衡
  white_balance_temperature_auto: 0
  # 白平衡
  white_balance_temperature: 5194
  # 逆光对比
  backlight_compensation: 1
  # 自动曝光 (0: 开启 3:关闭)
  exposure_auto: 3
  # 曝光
  exposure_absolute: 156
roi:
  enable: false
  x: 170
  y: 90
  w: 300
  h: 300